
name: MoneyPrinterTurbo - Cloud Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Download MoneyPrinterTurbo
        run: |
          git clone --depth 1 \
            https://github.com/harry0703/MoneyPrinterTurbo.git \
            MoneyPrinterTurbo

      - name: Install dependencies
        working-directory: MoneyPrinterTurbo
        run: |
          uv sync --frozen
          cp config.example.toml config.toml

      - name: Download reusable public-domain images
        run: |
          mkdir -p MoneyPrinterTurbo/storage/local_videos

          cat > /tmp/get_images.py <<'PY'
          import json
          import time
          import requests
          from pathlib import Path

          out = Path("MoneyPrinterTurbo/storage/local_videos")
          headers = {
              "User-Agent": "ShortsAutomation/1.0 (educational video project)"
          }

          searches = [
              "historic map North Carolina public domain",
              "Atlantic coast historical map public domain",
              "old sailing ship public domain",
              "historic wooden settlement public domain",
              "Roanoke Island historical public domain",
              "old map Virginia public domain",
          ]

          session = requests.Session()
          session.headers.update(headers)
          downloaded = []
          seen = set()

          for term in searches:
              if len(downloaded) >= 4:
                  break

              try:
                  response = session.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={
                          "action": "query",
                          "format": "json",
                          "generator": "search",
                          "gsrsearch": term,
                          "gsrnamespace": 6,
                          "gsrlimit": 15,
                          "prop": "imageinfo",
                          "iiprop": "url|extmetadata",
                          "iiurlwidth": 1200,
                      },
                      timeout=30,
                  )
                  response.raise_for_status()
                  pages = response.json().get("query", {}).get("pages", {})
              except Exception as exc:
                  print(f"Search failed for {term}: {exc}")
                  continue

              for page in pages.values():
                  if len(downloaded) >= 4:
                      break

                  info = (page.get("imageinfo") or [{}])[0]
                  meta = info.get("extmetadata") or {}
                  license_name = (
                      meta.get("LicenseShortName", {}).get("value", "")
                  ).lower()
                  title = page.get("title", "")

                  if not (
                      "public domain" in license_name
                      or license_name == "cc0"
                      or "cc0" in license_name
                  ):
                      continue

                  url = info.get("thumburl") or info.get("url")
                  if not url or url in seen:
                      continue
                  seen.add(url)

                  try:
                      image = session.get(url, timeout=45)
                      image.raise_for_status()
                      content_type = image.headers.get(
                          "Content-Type", ""
                      ).lower()

                      if not content_type.startswith("image/"):
                          continue

                      ext = ".jpg"
                      if "png" in content_type:
                          ext = ".png"
                      elif "webp" in content_type:
                          ext = ".webp"

                      path = out / f"history_{len(downloaded)+1}{ext}"
                      path.write_bytes(image.content)

                      if path.stat().st_size < 10000:
                          path.unlink(missing_ok=True)
                          continue

                      downloaded.append(str(path.resolve()))
                      print(f"Downloaded: {title}")
                      print(f"License: {license_name}")
                      print(f"Source: {url}")
                      time.sleep(0.3)
                  except Exception as exc:
                      print(f"Image download failed: {exc}")

          if len(downloaded) < 2:
              raise SystemExit(
                  "Could not find at least 2 suitable public-domain/CC0 images."
              )

          Path("MoneyPrinterTurbo/storage/local_videos/image_manifest.json").write_text(
              json.dumps(downloaded, indent=2),
              encoding="utf-8",
          )
          print(f"Downloaded {len(downloaded)} licensed images.")
          PY

          python /tmp/get_images.py

      - name: Generate English Short
        working-directory: MoneyPrinterTurbo
        run: |
          MATERIALS="$(python -c 'import json; print(",".join(json.load(open("storage/local_videos/image_manifest.json"))))')"

          uv run python cli.py \
            --video-script "In 1587, more than one hundred English settlers arrived on Roanoke Island. When a supply ship returned three years later, the settlement was deserted. The only famous clue was the word CROATOAN carved into a post. No single explanation has been proven. Some researchers believe the colonists joined nearby Indigenous communities, while other theories remain debated. The Lost Colony remains one of early America's most enduring mysteries. What do you think happened?" \
            --video-source local \
            --video-materials "$MATERIALS" \
            --video-language en-US \
            --video-aspect 9:16 \
            --voice-name en-US-AndrewNeural \
            --bgm-type none \
            --video-count 1 \
            --subtitle-enabled \
            --subtitle-position bottom

      - name: Find and validate output
        run: |
          mkdir -p output

          VIDEO="$(find MoneyPrinterTurbo/storage/tasks \
            -type f -name '*.mp4' \
            -printf '%T@ %p\n' 2>/dev/null \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)"

          if [ -z "$VIDEO" ]; then
            echo "::error::No output video was found."
            exit 1
          fi

          cp "$VIDEO" output/final_short.mp4

          ffprobe -v error \
            -show_entries stream=codec_type,width,height \
            -of default=noprint_wrappers=1 \
            output/final_short.mp4

          test -s output/final_short.mp4

      - name: Upload generated video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moneyprinter-turbo-test
          path: output/final_short.mp4
          if-no-files-found: warn
          retention-days: 3
