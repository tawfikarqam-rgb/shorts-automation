
name: MoneyPrinterTurbo - Daily Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "15 19 * * *"
      timezone: "Africa/Cairo"

permissions:
  contents: read

concurrency:
  group: moneyprinter-turbo-daily
  cancel-in-progress: false

jobs:
  generate:
    name: Generate ${{ matrix.channel }} Short
    strategy:
      fail-fast: false
      matrix:
        channel: [business, history]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHANNEL_NAME: ${{ matrix.channel }}

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore channel analytics history
        uses: actions/cache/restore@v4
        with:
          path: analytics_data
          key: shorts-analytics-${{ matrix.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            shorts-analytics-${{ matrix.channel }}-

      - name: Select today's story
        run: python scripts/daily_story.py

      - name: Generate researched script with OxionAI (optional)
        env:
          OXIONAI_RESEARCH_API_KEY: ${{ secrets.OXIONAI_RESEARCH_API_KEY }}
          OXIONAI_WRITER_API_KEY: ${{ secrets.OXIONAI_WRITER_API_KEY }}
          OXIONAI_RESEARCH_MODEL: gemini-3.7-flash
          OXIONAI_WRITER_MODEL: deepseek-v4-flash-0731
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests
          python scripts/oxion_content.py

      - name: Check and install system dependencies
        timeout-minutes: 8
        run: |
          set -euo pipefail

          if ! command -v ffmpeg >/dev/null 2>&1 || \
             ! command -v ffprobe >/dev/null 2>&1 || \
             ! command -v fc-list >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              ffmpeg fontconfig fonts-dejavu-core
          fi

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          fc-list | head -n 5 || true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download MoneyPrinterTurbo
        timeout-minutes: 3
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/harry0703/MoneyPrinterTurbo.git \
            MoneyPrinterTurbo

          test -f MoneyPrinterTurbo/pyproject.toml
          test -f MoneyPrinterTurbo/cli.py
          test -f MoneyPrinterTurbo/config.example.toml

      - name: Install MoneyPrinterTurbo dependencies
        working-directory: MoneyPrinterTurbo
        timeout-minutes: 18
        run: |
          set -euo pipefail

          uv sync --frozen
          cp config.example.toml config.toml

          uv run python cli.py --help

      - name: Download reusable public-domain images
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check requests
          python scripts/download_images.py

      - name: Install readable subtitle font
        run: |
          set -euo pipefail
          mkdir -p MoneyPrinterTurbo/resource/fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf MoneyPrinterTurbo/resource/fonts/DejaVuSans-Bold.ttf
          test -s MoneyPrinterTurbo/resource/fonts/DejaVuSans-Bold.ttf

      - name: Generate English Short
        working-directory: MoneyPrinterTurbo
        timeout-minutes: 20
        run: |
          set -euo pipefail

          echo "Generating channel: $CHANNEL_NAME"
          echo "Generating topic: $STORY_TOPIC"

          MATERIALS="$(python -c \
            'import json; print(",".join(json.load(open("storage/local_videos/image_manifest.json"))))')"

          test -n "$MATERIALS"

          # Give Edge TTS more time on GitHub-hosted runners. Keep Edge subtitles
          # enabled so their timestamps remain aligned with the selected voice.
          printf '\nedge_tts_timeout = 90\nsubtitle_provider = "edge"\n' >> config.toml

          GENERATED=0
          for VOICE in en-US-AndrewNeural en-US-GuyNeural en-US-BrianNeural en-US-AriaNeural; do
            echo "::group::Trying narration voice: $VOICE"
            if uv run python cli.py \
              --video-script "$VIDEO_SCRIPT" \
              --video-source local \
              --video-materials "$MATERIALS" \
              --video-language en-US \
              --video-aspect 9:16 \
              --voice-name "$VOICE" \
              --bgm-type none \
              --video-count 1 \
              --subtitle-enabled \
              --subtitle-position bottom \
              --font-name DejaVuSans-Bold.ttf \
              --font-size 76 \
              --text-fore-color "#FFFFFF" \
              --stroke-color "#000000" \
              --stroke-width 4 \
              --subtitle-background-enabled \
              --subtitle-background-color "#000000" \
              --rounded-subtitle-background; then
              GENERATED=1
              echo "Narration succeeded with $VOICE"
              echo "::endgroup::"
              break
            fi
            echo "Voice $VOICE failed; trying the next free Edge voice."
            echo "::endgroup::"
          done

          if [ "$GENERATED" -ne 1 ]; then
            echo "::error::All configured free Edge TTS voices failed. No video will be uploaded."
            exit 1
          fi

      - name: Find and validate output
        timeout-minutes: 3
        run: |
          set -euo pipefail

          mkdir -p output

          VIDEO="$(
            find MoneyPrinterTurbo/storage/tasks \
              -type f -name '*.mp4' \
              -printf '%T@ %p\n' 2>/dev/null \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"

          if [ -z "$VIDEO" ] || [ ! -s "$VIDEO" ]; then
            echo "::error::No generated MP4 was found."
            echo "Recent task files:"
            find MoneyPrinterTurbo/storage/tasks \
              -maxdepth 4 -type f 2>/dev/null | tail -n 50 || true
            exit 1
          fi

          cp "$VIDEO" output/final_short.mp4

          ffprobe -v error \
            -show_entries stream=codec_type,width,height \
            -of default=noprint_wrappers=1 \
            output/final_short.mp4

          test -s output/final_short.mp4
          python scripts/validate_short.py output/final_short.mp4

          echo "Video generated successfully:"
          ls -lh output/final_short.mp4

      - name: Upload generated video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-${{ matrix.channel }}-${{ github.run_id }}
          path: output/final_short.mp4
          if-no-files-found: warn
          retention-days: 3

      - name: Upload AI research and token audit
        if: ${{ always() && hashFiles('output/ai_content_audit.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-content-audit-${{ matrix.channel }}-${{ github.run_id }}
          path: output/ai_content_audit.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Install YouTube upload dependencies
        if: ${{ success() && matrix.channel == 'business' }}
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Upload business Short to YouTube as PUBLIC
        if: ${{ success() && matrix.channel == 'business' }}
        env:
          VIDEO_PATH: output/final_short.mp4
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          : "${STORY_TOPIC:?STORY_TOPIC was not set by daily_story.py}"
          VIDEO_TITLE="${STORY_TOPIC} | Money & Business Stories" python scripts/upload_youtube_public.py

      - name: Install history YouTube upload dependencies
        if: ${{ success() && matrix.channel == 'history' && vars.ENABLE_HISTORY_PUBLIC_UPLOAD == 'true' }}
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Upload history Short to its YouTube channel as PUBLIC
        if: ${{ success() && matrix.channel == 'history' && vars.ENABLE_HISTORY_PUBLIC_UPLOAD == 'true' }}
        env:
          CHANNEL_NAME: history
          VIDEO_PATH: output/final_short.mp4
          YOUTUBE_CLIENT_ID: ${{ secrets.HISTORY_YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.HISTORY_YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.HISTORY_YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          : "${STORY_TOPIC:?STORY_TOPIC was not set by daily_story.py}"
          VIDEO_TITLE="${STORY_TOPIC} | History Shorts" python scripts/upload_youtube_public.py

      - name: Collect optional YouTube Analytics
        if: ${{ success() }}
        env:
          CHANNEL_NAME: ${{ matrix.channel }}
          YOUTUBE_CLIENT_ID: ${{ matrix.channel == 'history' && secrets.HISTORY_YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ matrix.channel == 'history' && secrets.HISTORY_YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ matrix.channel == 'history' && secrets.HISTORY_YOUTUBE_ANALYTICS_REFRESH_TOKEN || secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check google-api-python-client google-auth
          python scripts/collect_youtube_analytics.py --channel "$CHANNEL_NAME" --days 28

      - name: Save channel analytics history
        if: ${{ always() && hashFiles('analytics_data/*.jsonl') != '' }}
        uses: actions/cache/save@v4
        with:
          path: analytics_data
          key: shorts-analytics-${{ matrix.channel }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload analytics snapshot
        if: ${{ always() && hashFiles('analytics_data/*.jsonl') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: analytics-${{ matrix.channel }}-${{ github.run_id }}
          path: analytics_data/*.jsonl
          if-no-files-found: ignore
          retention-days: 90
