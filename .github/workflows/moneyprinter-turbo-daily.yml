
name: MoneyPrinterTurbo - Daily Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "15 19 * * *"
      timezone: "Africa/Cairo"

permissions:
  contents: read

concurrency:
  group: moneyprinter-turbo-daily
  cancel-in-progress: false

jobs:
  generate:
    name: Generate ${{ matrix.channel }} Short
    strategy:
      fail-fast: false
      matrix:
        channel: [business, history]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHANNEL_NAME: ${{ matrix.channel }}

    steps:
      - name: Checkout automation repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Select today's story
        run: python scripts/daily_story.py

      - name: Check and install system dependencies
        timeout-minutes: 8
        run: |
          set -euo pipefail

          if ! command -v ffmpeg >/dev/null 2>&1 || \
             ! command -v ffprobe >/dev/null 2>&1 || \
             ! command -v fc-list >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends \
              ffmpeg fontconfig fonts-dejavu-core
          fi

          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          fc-list | head -n 5 || true

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: false

      - name: Download MoneyPrinterTurbo
        timeout-minutes: 3
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/harry0703/MoneyPrinterTurbo.git \
            MoneyPrinterTurbo

          test -f MoneyPrinterTurbo/pyproject.toml
          test -f MoneyPrinterTurbo/cli.py
          test -f MoneyPrinterTurbo/config.example.toml

      - name: Install MoneyPrinterTurbo dependencies
        working-directory: MoneyPrinterTurbo
        timeout-minutes: 18
        run: |
          set -euo pipefail

          uv sync --frozen
          cp config.example.toml config.toml

          uv run python cli.py --help

      - name: Download reusable public-domain images
        timeout-minutes: 6
        run: |
          set -euo pipefail

          mkdir -p MoneyPrinterTurbo/storage/local_videos

          python -m pip install --disable-pip-version-check requests

          cat > /tmp/get_images.py <<'PY'
          import json
          import os
          import re
          import time
          import requests
          from pathlib import Path

          out = Path("MoneyPrinterTurbo/storage/local_videos")
          out.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({
              "User-Agent": "ShortsAutomation/1.1 (open-license educational video project)"
          })

          searches = [q.strip() for q in os.environ.get("IMAGE_SEARCHES", "").split(";") if q.strip()]
          downloaded = []
          sources = []
          seen = set()

          def save_image(url, title, license_name, attribution, landing_url, provider):
              if not url or url in seen or len(downloaded) >= 4:
                  return False
              seen.add(url)
              try:
                  response = session.get(url, timeout=30)
                  response.raise_for_status()
                  content_type = response.headers.get("Content-Type", "").lower()
                  if not content_type.startswith("image/"):
                      print(f"Skipped non-image response for {title}: {content_type}")
                      return False
                  ext = ".png" if "png" in content_type else ".webp" if "webp" in content_type else ".jpg"
                  path = out / f"scene_{len(downloaded) + 1}{ext}"
                  path.write_bytes(response.content)
                  if path.stat().st_size < 10000:
                      path.unlink(missing_ok=True)
                      return False
                  downloaded.append(str(path.resolve()))
                  sources.append({
                      "file": str(path),
                      "title": title,
                      "license": license_name,
                      "attribution": attribution,
                      "source_url": landing_url,
                      "provider": provider
                  })
                  print(f"Downloaded ({provider}): {title} [{license_name}]")
                  return True
              except Exception as exc:
                  print(f"Image download failed for {title}: {exc}")
                  return False

          # Primary source: Openverse. Commercial-use licenses only; CC BY/ BY-SA
          # results retain their creator and attribution details in image_sources.json.
          for term in searches:
              if len(downloaded) >= 4:
                  break
              try:
                  response = session.get(
                      "https://api.openverse.org/v1/images/",
                      params={
                          "q": term,
                          "license": "cc0,pdm,by,by-sa",
                          "license_type": "commercial",
                          "size": "large",
                          "page_size": 20,
                          "mature": "false",
                          "filter_dead": "true"
                      },
                      timeout=25
                  )
                  response.raise_for_status()
                  results = response.json().get("results", [])
              except Exception as exc:
                  print(f"Openverse search failed for '{term}': {exc}")
                  continue

              for item in results:
                  if len(downloaded) >= 4:
                      break
                  if item.get("license") not in {"cc0", "pdm", "by", "by-sa"}:
                      continue
                  save_image(
                      item.get("url") or item.get("thumbnail"),
                      item.get("title", term),
                      f'{item.get("license", "").upper()} {item.get("license_version", "")}'.strip(),
                      item.get("attribution", ""),
                      item.get("foreign_landing_url", ""),
                      f'Openverse/{item.get("provider", "unknown")}'
                  )
              time.sleep(0.25)

          # Fallback source: Wikimedia Commons, also restricted to public-domain/CC0.
          if len(downloaded) < 2:
              print("Openverse returned fewer than 2 usable images; trying Wikimedia Commons.")
              for term in searches:
                  if len(downloaded) >= 4:
                      break
                  try:
                      response = session.get(
                          "https://commons.wikimedia.org/w/api.php",
                          params={
                              "action": "query", "format": "json",
                              "generator": "search", "gsrsearch": term,
                              "gsrnamespace": 6, "gsrlimit": 20,
                              "prop": "imageinfo", "iiprop": "url|extmetadata",
                              "iiurlwidth": 2560
                          },
                          timeout=25
                      )
                      response.raise_for_status()
                      pages = response.json().get("query", {}).get("pages", {})
                  except Exception as exc:
                      print(f"Wikimedia search failed for '{term}': {exc}")
                      continue

                  query_tokens = {
                      token.lower() for token in re.findall(r"[a-zA-Z0-9]+", term)
                      if len(token) >= 4
                  }
                  candidates = []
                  for page in pages.values():
                      info = (page.get("imageinfo") or [{}])[0]
                      meta = info.get("extmetadata") or {}
                      license_name = meta.get("LicenseShortName", {}).get("value", "")
                      normalized = license_name.lower()
                      if not ("public domain" in normalized or normalized.strip() == "cc0" or "cc0" in normalized):
                          continue
                      title = page.get("title", "")
                      title_tokens = {
                          token.lower() for token in re.findall(r"[a-zA-Z0-9]+", title)
                          if len(token) >= 4
                      }
                      overlap = len(query_tokens & title_tokens)
                      candidates.append((overlap, page))

                  candidates.sort(key=lambda item: item[0], reverse=True)
                  for _, page in candidates:
                      if len(downloaded) >= 4:
                          break
                      info = (page.get("imageinfo") or [{}])[0]
                      meta = info.get("extmetadata") or {}
                      title = page.get("title", "")
                      license_name = meta.get("LicenseShortName", {}).get("value", "Public domain")
                      save_image(
                          info.get("thumburl") or info.get("url"),
                          title,
                          license_name,
                          meta.get("Artist", {}).get("value", ""),
                          meta.get("ImageDescription", {}).get("value", ""),
                          "Wikimedia Commons"
                      )
                  time.sleep(0.25)

          if len(downloaded) < 2:
              raise SystemExit(
                  f"Could not find at least 2 usable openly licensed images; found {len(downloaded)}. "
                  "See Openverse and Wikimedia search logs."
              )

          (out / "image_manifest.json").write_text(
              json.dumps(downloaded, indent=2), encoding="utf-8"
          )
          (out / "image_sources.json").write_text(
              json.dumps(sources, indent=2, ensure_ascii=False), encoding="utf-8"
          )
          print(f"Downloaded {len(downloaded)} openly licensed images.")
          print(f"Image source and attribution manifest: {out / 'image_sources.json'}")
          PY

          python /tmp/get_images.py

      - name: Install readable subtitle font
        run: |
          set -euo pipefail
          mkdir -p MoneyPrinterTurbo/resource/fonts
          cp /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf MoneyPrinterTurbo/resource/fonts/DejaVuSans-Bold.ttf
          test -s MoneyPrinterTurbo/resource/fonts/DejaVuSans-Bold.ttf

      - name: Generate English Short
        working-directory: MoneyPrinterTurbo
        timeout-minutes: 20
        run: |
          set -euo pipefail

          echo "Generating channel: $CHANNEL_NAME"
          echo "Generating topic: $STORY_TOPIC"

          MATERIALS="$(python -c \
            'import json; print(",".join(json.load(open("storage/local_videos/image_manifest.json"))))')"

          test -n "$MATERIALS"

          # Give Edge TTS more time on GitHub-hosted runners. Keep Edge subtitles
          # enabled so their timestamps remain aligned with the selected voice.
          printf '\nedge_tts_timeout = 90\nsubtitle_provider = "edge"\n' >> config.toml

          GENERATED=0
          for VOICE in en-US-AndrewNeural en-US-GuyNeural en-US-BrianNeural en-US-AriaNeural; do
            echo "::group::Trying narration voice: $VOICE"
            if uv run python cli.py \
              --video-script "$VIDEO_SCRIPT" \
              --video-source local \
              --video-materials "$MATERIALS" \
              --video-language en-US \
              --video-aspect 9:16 \
              --voice-name "$VOICE" \
              --bgm-type none \
              --video-count 1 \
              --subtitle-enabled \
              --subtitle-position bottom \
              --font-name DejaVuSans-Bold.ttf \
              --font-size 76 \
              --text-fore-color "#FFFFFF" \
              --stroke-color "#000000" \
              --stroke-width 4 \
              --subtitle-background-enabled \
              --subtitle-background-color "#000000" \
              --rounded-subtitle-background; then
              GENERATED=1
              echo "Narration succeeded with $VOICE"
              echo "::endgroup::"
              break
            fi
            echo "Voice $VOICE failed; trying the next free Edge voice."
            echo "::endgroup::"
          done

          if [ "$GENERATED" -ne 1 ]; then
            echo "::error::All configured free Edge TTS voices failed. No video will be uploaded."
            exit 1
          fi

      - name: Find and validate output
        timeout-minutes: 3
        run: |
          set -euo pipefail

          mkdir -p output

          VIDEO="$(
            find MoneyPrinterTurbo/storage/tasks \
              -type f -name '*.mp4' \
              -printf '%T@ %p\n' 2>/dev/null \
              | sort -nr \
              | head -n 1 \
              | cut -d' ' -f2-
          )"

          if [ -z "$VIDEO" ] || [ ! -s "$VIDEO" ]; then
            echo "::error::No generated MP4 was found."
            echo "Recent task files:"
            find MoneyPrinterTurbo/storage/tasks \
              -maxdepth 4 -type f 2>/dev/null | tail -n 50 || true
            exit 1
          fi

          cp "$VIDEO" output/final_short.mp4

          ffprobe -v error \
            -show_entries stream=codec_type,width,height \
            -of default=noprint_wrappers=1 \
            output/final_short.mp4

          test -s output/final_short.mp4
          python scripts/validate_short.py output/final_short.mp4

          echo "Video generated successfully:"
          ls -lh output/final_short.mp4

      - name: Upload generated video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-short-${{ matrix.channel }}-${{ github.run_id }}
          path: output/final_short.mp4
          if-no-files-found: warn
          retention-days: 3

      - name: Install YouTube upload dependencies
        if: ${{ success() && matrix.channel == 'business' }}
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Upload business Short to YouTube as PUBLIC
        if: ${{ success() && matrix.channel == 'business' }}
        env:
          VIDEO_PATH: output/final_short.mp4
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          : "${STORY_TOPIC:?STORY_TOPIC was not set by daily_story.py}"
          VIDEO_TITLE="${STORY_TOPIC} | Money & Business Stories" python scripts/upload_youtube_public.py

      - name: Install history YouTube upload dependencies
        if: ${{ success() && matrix.channel == 'history' && vars.ENABLE_HISTORY_PUBLIC_UPLOAD == 'true' }}
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Upload history Short to its YouTube channel as PUBLIC
        if: ${{ success() && matrix.channel == 'history' && vars.ENABLE_HISTORY_PUBLIC_UPLOAD == 'true' }}
        env:
          CHANNEL_NAME: history
          VIDEO_PATH: output/final_short.mp4
          YOUTUBE_CLIENT_ID: ${{ secrets.HISTORY_YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.HISTORY_YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.HISTORY_YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          : "${STORY_TOPIC:?STORY_TOPIC was not set by daily_story.py}"
          VIDEO_TITLE="${STORY_TOPIC} | History Shorts" python scripts/upload_youtube_public.py
