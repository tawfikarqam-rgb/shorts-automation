name: Gemini Content Pipeline Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Compile production scripts
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/daily_story.py \
            scripts/gemini_content.py \
            scripts/publish_guard.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
