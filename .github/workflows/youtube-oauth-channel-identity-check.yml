name: YouTube OAuth Channel Identity Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-oauth-identity-check
  cancel-in-progress: false

jobs:
  verify-channel-identity:
    name: Verify ${{ matrix.channel }} OAuth identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        channel: [business, history]
    env:
      CHANNEL_NAME: ${{ matrix.channel }}
      YOUTUBE_CLIENT_ID: ${{ matrix.channel == 'history' && secrets.HISTORY_YOUTUBE_CLIENT_ID || secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ matrix.channel == 'history' && secrets.HISTORY_YOUTUBE_CLIENT_SECRET || secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ matrix.channel == 'history' && secrets.HISTORY_YOUTUBE_REFRESH_TOKEN || secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install read-only verification dependencies
        run: python -m pip install --disable-pip-version-check google-api-python-client google-auth

      - name: Read authenticated YouTube channel identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import sys
          from google.auth.exceptions import RefreshError, GoogleAuthError
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          channel = os.environ["CHANNEL_NAME"]
          required = ("YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print(f"RESULT=CONFIGURATION_MISSING channel={channel} missing={','.join(missing)}")
              sys.exit(1)

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.readonly"],
          )

          try:
              youtube = build("youtube", "v3", credentials=credentials, cache_discovery=False)
              response = youtube.channels().list(part="id,snippet", mine=True, maxResults=10).execute()
          except RefreshError as exc:
              # google-auth commonly stores OAuth response data in a later exception arg.
              # Print only allowlisted fields; never print raw exception text, tokens, or headers.
              print(f"RESULT=OAUTH_REFRESH_FAILED channel={channel}")
              try:
                  import json
                  import re
                  error_code = ""
                  error_description = ""
                  for arg in getattr(exc, "args", ()):
                      candidate = arg
                      if isinstance(candidate, bytes):
                          candidate = candidate.decode("utf-8", errors="replace")
                      if isinstance(candidate, dict):
                          error_code = str(candidate.get("error", error_code))[:100]
                          error_description = str(candidate.get("error_description", error_description))[:300]
                      elif isinstance(candidate, str):
                          match = re.search(r"\b(invalid_grant|invalid_client|invalid_scope|unauthorized_client|access_denied|temporarily_unavailable)\b", candidate)
                          if match and not error_code:
                              error_code = match.group(1)
                          try:
                              parsed = json.loads(candidate)
                              if isinstance(parsed, dict):
                                  error_code = str(parsed.get("error", error_code))[:100]
                                  error_description = str(parsed.get("error_description", error_description))[:300]
                          except Exception:
                              pass
                  print(f"OAUTH_ERROR={error_code or 'not_exposed_by_google_auth'}")
                  if error_description:
                      print(f"OAUTH_ERROR_DESCRIPTION={error_description}")
                  else:
                      print("OAUTH_ERROR_DESCRIPTION=not_exposed")
              except Exception:
                  print("OAUTH_ERROR_DETAILS=unavailable")
              sys.exit(1)
          except HttpError as exc:
              # Print only Google's structured API error diagnostics; never print request headers or credentials.
              import json
              status = getattr(exc.resp, "status", "unknown")
              print(f"RESULT=YOUTUBE_API_ERROR channel={channel} http_status={status}; no write operation was attempted.")
              try:
                  payload = json.loads(exc.content.decode("utf-8", errors="replace"))
                  error = payload.get("error", {}) if isinstance(payload, dict) else {}
                  message = str(error.get("message", ""))[:500]
                  print(f"GOOGLE_ERROR_STATUS={str(error.get('status', ''))[:100]}")
                  if message:
                      print(f"GOOGLE_ERROR_MESSAGE={message}")
                  for item in error.get("errors", [])[:5]:
                      if isinstance(item, dict):
                          print(f"GOOGLE_ERROR_REASON={str(item.get('reason', ''))[:100]}")
                          print(f"GOOGLE_ERROR_DOMAIN={str(item.get('domain', ''))[:100]}")
              except Exception:
                  print("GOOGLE_ERROR_DETAILS=unavailable; response body could not be safely parsed.")
              sys.exit(1)
          except GoogleAuthError:
              print(f"RESULT=GOOGLE_AUTH_ERROR channel={channel}; credentials could not be authenticated.")
              sys.exit(1)
          except Exception as exc:
              print(f"RESULT=CHECK_FAILED channel={channel} error_type={type(exc).__name__}; details suppressed.")
              sys.exit(1)

          items = response.get("items", [])
          if not items:
              print(f"RESULT=NO_CHANNEL_RETURNED channel={channel}; this token did not resolve to a YouTube channel.")
              sys.exit(2)

          print(f"RESULT=SUCCESS channel_secret_set={channel} returned_channels={len(items)}")
          for item in items:
              snippet = item.get("snippet", {})
              print(f"CHANNEL_ID={item.get('id', '')}")
              print(f"CHANNEL_TITLE={snippet.get('title', '')}")
              print(f"CHANNEL_CUSTOM_URL={snippet.get('customUrl', '')}")
          print("OPERATION=channels.list(mine=true) READ_ONLY")
          print("UPLOAD_ATTEMPTED=false")
          PY

      - name: Confirm read-only boundary
        if: always()
        run: |
          echo "This workflow only calls YouTube channels.list with mine=true."
          echo "It does not upload, update, delete, or publish videos."
          echo "No OAuth token or secret value is printed."
