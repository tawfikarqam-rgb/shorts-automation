
name: Generate AI Short

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Describe the video scene"
        required: true
        type: string
        default: "A tiny orange kitten exploring a futuristic neon city at night, cinematic lighting, smooth camera movement"
      seed:
        description: "Random seed (-1 for random)"
        required: true
        type: string
        default: "-1"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gradio_client requests

      - name: Generate video
        env:
          VIDEO_PROMPT: ${{ inputs.prompt }}
          VIDEO_SEED: ${{ inputs.seed }}
        run: |
          mkdir -p output
          python scripts/generate_video.py

      - name: Upload generated video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-short
          path: output/
          if-no-files-found: warn
          retention-days: 3
