
name: Generate Shorts for Both Channels

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Random seed (-1 for random)"
        required: true
        type: string
        default: "-1"

permissions:
  contents: read

jobs:
  generate:
    name: Generate ${{ matrix.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: secrets-mysteries
            channel_id: secrets-mysteries
            artifact: secrets-mysteries-short
            prompt: "A cinematic historical mystery documentary scene showing an ancient lost civilization, weathered stone ruins, dramatic torchlight, atmospheric fog, realistic textures, slow cinematic camera movement, vertical composition, no text, no logos"

          - channel: money-power-stories
            channel_id: money-power-stories
            artifact: money-power-short
            prompt: "A cinematic business history documentary scene showing a powerful financial district at dusk, towering corporate skyscrapers, dramatic lighting, realistic documentary style, slow cinematic camera movement, vertical composition, no text, no logos"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gradio_client requests edge-tts

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate AI scene
        env:
          VIDEO_PROMPT: ${{ matrix.prompt }}
          VIDEO_SEED: ${{ inputs.seed }}
        run: |
          mkdir -p output
          python scripts/generate_video.py

      - name: Assemble narrated vertical Short
        env:
          CHANNEL_ID: ${{ matrix.channel_id }}
        run: |
          python scripts/assemble_short.py

      - name: Validate final video
        run: |
          test -f output/final_short.mp4
          test -s output/final_short.mp4

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            output/final_short.mp4

          ffprobe -v error \
            -select_streams a:0 \
            -show_entries stream=codec_name \
            -of default=noprint_wrappers=1 \
            output/final_short.mp4

      - name: Upload channel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: output/final_short.mp4
          if-no-files-found: error
          retention-days: 3
