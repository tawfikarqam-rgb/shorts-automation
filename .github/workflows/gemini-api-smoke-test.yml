name: Gemini API Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-api-smoke-test
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Read-only Gemini API and Google Search check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Test Gemini API and Google Search grounding
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
        run: python scripts/gemini_api_smoke.py
